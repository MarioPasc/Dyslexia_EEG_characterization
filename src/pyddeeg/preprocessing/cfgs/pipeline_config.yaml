# ========================== MASTER PIPELINE YAML =========================
# This file unifies every option that existed in
#   • zerolag_config.yaml   
#   • rqa_windows.yaml      
# plus the global paths used by the orchestrator.
# ------------------------------------------------------------------------

paths:
  raw_timeseries_dir: "/mnt/home/users/tic_163_uma/mpascual/fscratch/datasets/EEG/original"
  zerolag_out_dir:    "/mnt/home/users/tic_163_uma/mpascual/fscratch/datasets/EEG/zerolag"
  rqa_out_root:       "/mnt/home/users/tic_163_uma/mpascual/fscratch/datasets/EEG/raw"
  dataset_out_dir:    "/mnt/home/users/tic_163_uma/mpascual/execs/WINDOW_CLASSIFICATION/dataset"

# ------------------------------------------------------------------------
zerolag:        # ← Stage-1 template (can be used standalone)
  # Data & I/O (paths are overridden by the orchestrator)
  age: "7"
  stim: "2"            # will be overridden dynamically
  sampling_freq: 500
  nframes: 68000        # <- real length at 500 Hz
  speed: "fast"         # "slow" or "fast"
  show_filter_response: false

  eeg_bands:            # Hz
    Delta: [0.5, 4]
    Theta: [4, 8]
    Alpha: [8, 12]
    Beta:  [12, 30]
    Gamma: [30, 80]

  ch_names: &channels   # reuse anchor later if needed
    - "Fp1"  
    - "Fp2"  
    - "F7" 
    - "F3"  
    - "Fz"  
    - "F4"  
    - "F8"
    - "FC5"  
    - "FC1"  
    - "FC2" 
    - "FC6" 
    - "T7"  
    - "C3"  
    - "C4"
    - "T8"   
    - "TP9"  
    - "CP5" 
    - "CP1" 
    - "CP2" 
    - "CP6" 
    - "TP10"
    - "P7"   
    - "P3"   
    - "Pz"  
    - "P4"  
    - "P8"  
    - "PO9" 
    - "O1"
    - "Oz"   
    - "O2"   
    - "PO10" 
    - "Cz"

# ------------------------------------------------------------------------
rqa:            # ← Stage-2 template (can be used standalone)
  # Dask parallelism
  dask:
    use_dask: true
    n_workers: 8
    threads_per_worker: 2
    memory_limit: "16GB"

  # I/O (paths overridden by orchestrator)
  datasets:
    CT_UP:   "CT_UP_preprocess_${STIM}.npz"   # ${STIM} replaced on the fly
    DD_UP:   "DD_UP_preprocess_${STIM}.npz"
    CT_DOWN: "CT_DOWN_preprocess_${STIM}.npz"
    DD_DOWN: "DD_DOWN_preprocess_${STIM}.npz"

  logging:
    directory: ""   # auto-set inside each electrode folder
    filename: "rqa_windows.log"
    level: "INFO"

  # Processing parameters
  target_channel: ""     # injected on the fly
  target_bandwidth: 1
  window_sizes: [500, 750, 1000]  # ms

  # Takens-space tuning  (was missing)
  optimise_takens:  true      # whether to fine-tune τ and m
  tuning_max_lag:   120       # lag search range (samples)
  tuning_max_dim:   12        # max embedding dimension
  tuning_rec_rate:  0.15      # target recurrence rate for radius search


  # RQA parameters (identical to usual file)
  rqa_parameters:
    embedding_dim: 10
    radius: 0.8
    time_delay: 1
    min_diagonal_line: 5
    min_vertical_line: 1
    min_white_vertical_line: 1
    metrics_to_use:
      - "RR"     
      - "DET"        
      - "L_max"  
      - "L_mean"
      - "ENT"    
      - "LAM"        
      - "TT"     
      - "V_max"
      - "V_mean" 
      - "V_ENT"      
      - "W_max"  
      - "W_mean"
      - "W_ENT"  
      - "CLEAR"      
      - "PERM_ENT"
# ========================================================================
