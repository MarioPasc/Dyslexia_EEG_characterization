base_estimator: sklearn.ensemble.ExtraTreesClassifier

hyperparameters:
  n_estimators:      {min: 100, max: 600, type: integer}
  max_depth:         {min: 2,   max: 40,  type: integer}
  min_samples_split: {min: 2,   max: 20,  type: integer}
  min_samples_leaf:  {min: 1,   max: 20,  type: integer}
  max_features:      {min: 0.05, max: 1.0, type: float}
  bootstrap:         {values: [true, false], type: categorical}
  class_weight:      {values: [null, 'balanced'], type: categorical}
