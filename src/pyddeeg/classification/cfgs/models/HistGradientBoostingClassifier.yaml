base_estimator: sklearn.ensemble.HistGradientBoostingClassifier

hyperparameters:
  learning_rate:     {min: 1e-3, max: 3e-1, type: float}
  max_depth:         {min: 2,    max: 20,  type: integer}
  max_leaf_nodes:    {min: 15,   max: 255, type: integer}
  l2_regularization: {min: 0.0,  max: 1.0, type: float}
  max_bins:          {min: 32,   max: 255, type: integer}
  subsample:         {min: 0.5,  max: 1.0, type: float}
  early_stopping:    {values: [true, false], type: categorical}
